<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Dork Link Collector</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16211d;--mute:#5b6b65;--line:#d3dcd8;--acc:#0d6b57;--acc-ink:#fff;--warn:#7a4b00;--warn-bg:#fff4dc;--err:#8f1d1d;--err-bg:#fde8e8;--ok:#0d5a3a;--ok-bg:#e1f5ea;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1513;--card:#17201d;--ink:#e6efeb;--mute:#93a59d;--line:#2b3a35;--acc:#3fc2a0;--acc-ink:#06201a;--warn:#f0c470;--warn-bg:#2f2610;--err:#ffb4b4;--err-bg:#3a1717;--ok:#8fe3b8;--ok-bg:#143225}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:.2em 0 .1em;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px}
.card,details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
details>summary{cursor:pointer;font-weight:600}
details[open]>summary{margin-bottom:10px}
